# mcp-gateway — the only published entry to the MCP servers (docker-compose.yml).
#
# Same ports as the servers used to publish, so .mcp.json does not change:
#   3001 obsidian · 3002 qdrant · 3003 git · 3005 atlas
#
# DNS rebinding: a web page can make the browser talk to http://<attacker domain>:3003 after
# re-pointing that domain to 127.0.0.1. The ports are bound to localhost, so the network is out,
# but the browser is on localhost. Two checks close that door for every server at once:
#   * Host must be localhost / 127.0.0.1 / [::1] (any port) — a rebinding domain fails here;
#   * a browser Origin, when present, must be one of those hosts — a cross-site fetch fails here.
# Agents (Claude Code, Cursor, Antigravity, curl) send Host: localhost:<port> and no Origin.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;

  # Docker's embedded DNS: upstreams are resolved per request, so the gateway starts (and keeps
  # serving the others) even while one MCP container is restarting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $host $aidd_host_ok {
    localhost   1;
    127.0.0.1   1;
    "[::1]"     1;
    default     0;
  }
  map $http_origin $aidd_origin_ok {
    ""                                                     1;
    "~^https?://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?$" 1;
    default                                                0;
  }

  # streamable HTTP / SSE: no buffering, long reads
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_set_header Host $http_host;
  proxy_set_header Connection "";
  client_max_body_size 10m;

  server {
    listen 3001;
    location / {
      if ($aidd_host_ok = 0)   { return 403 "forbidden host\n"; }
      if ($aidd_origin_ok = 0) { return 403 "forbidden origin\n"; }
      set $up http://mcp-obsidian:3000;
      proxy_pass $up;
    }
  }
  server {
    listen 3002;
    location / {
      if ($aidd_host_ok = 0)   { return 403 "forbidden host\n"; }
      if ($aidd_origin_ok = 0) { return 403 "forbidden origin\n"; }
      set $up http://mcp-qdrant:3000;
      proxy_pass $up;
    }
  }
  server {
    listen 3003;
    location / {
      if ($aidd_host_ok = 0)   { return 403 "forbidden host\n"; }
      if ($aidd_origin_ok = 0) { return 403 "forbidden origin\n"; }
      set $up http://mcp-git:3000;
      proxy_pass $up;
    }
  }
  server {
    listen 3005;
    location / {
      if ($aidd_host_ok = 0)   { return 403 "forbidden host\n"; }
      if ($aidd_origin_ok = 0) { return 403 "forbidden origin\n"; }
      set $up http://mcp-atlas:3000;
      proxy_pass $up;
    }
  }

  # container healthcheck only (not published)
  server {
    listen 8080;
    location = /health { return 200 "ok\n"; }
  }
}
