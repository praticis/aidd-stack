name: praticis-aidd

# Configuration contract: every `${VAR:?}` below is REQUIRED. How it is
# provided is up to the caller — ~/.aidd/.env (written by setup/install.sh),
# the host environment, `--env-file`, a secrets manager, CI variables.
# Compose aborts before starting any container if one is unset or empty.
#
# Exposure (docs/ROADMAP.md, trilha "Segurança e operação"):
#   * every published port binds to AIDD_BIND_ADDRESS (default 127.0.0.1) — nothing is
#     reachable from the network the laptop is on;
#   * the MCP servers publish nothing themselves: `mcp-gateway` fronts them on the same
#     ports as before (3001/3002/3003/3005) and refuses any request whose Host or browser
#     Origin is not localhost — the defense against DNS rebinding from a web page;
#   * Qdrant requires QDRANT_API_KEY, Neo4j its password; images and packages are pinned.
# Containers that touch host files run as the host user (AIDD_UID/AIDD_GID, written by
# install.sh), so nothing in the workspace or vault ends up owned by root.

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# Shared by `indexer` (on-demand) and `refresher` (the loop): the workspace is READ-ONLY —
# git reads and fetches happen in mirrors the indexer owns (indexer/aidd_indexer/core/mirror.py).
x-indexer: &indexer
  build:
    context: ./indexer
    dockerfile: Dockerfile
  image: aidd-indexer:local          # shared with mcp-atlas: built once
  user: "${AIDD_UID:-1000}:${AIDD_GID:-1000}"
  <<: *hardened
  depends_on:
    neo4j:
      condition: service_healthy
  environment: &indexer-env
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USERNAME: ${NEO4J_USER:?}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?}
    NEO4J_DATABASE: ${NEO4J_DATABASE:?}
    WORKSPACE_PATH: /workspace
    AIDD_TENANT: ${AIDD_TENANT:?}
    AIDD_CONFIG: /app/atlas.yaml
    AIDD_TRIGGER: ${AIDD_TRIGGER:-manual}       # recorded on IndexRun: manual | scheduled | bootstrap
    AIDD_MIRROR_DIR: /var/lib/aidd/mirrors
    AIDD_STATE_DIR: /var/lib/aidd/state
    AIDD_REFRESH_INTERVAL_MINUTES: ${AIDD_REFRESH_INTERVAL_MINUTES:-15}
    HOME: /tmp
    # --- remote fetch into the mirrors: a read-only PAT, read from a file (never an env var) ---
    AIDD_GIT_TOKEN_FILE: /run/secrets/git-token
    GIT_ASKPASS: /app/git-askpass.sh
    GIT_TERMINAL_PROMPT: "0"
    GIT_SSH_COMMAND: ssh -o BatchMode=yes
    AIDD_GIT_USERNAME: ${AIDD_GIT_USERNAME:-x-access-token}
  secrets:
    - git-token
  volumes:
    - ${WORKSPACE_PATH:?}:/workspace:ro
    - ./atlas.yaml:/app/atlas.yaml:ro
    - ./mirrors:/var/lib/aidd/mirrors
    - ./state:/var/lib/aidd/state

services:

  # ──────────────────────────────────────────────────────
  # QDRANT — semantic memory server for this stack's projects.
  # ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    container_name: aidd-core-qdrant
    ports:
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:6333:6333"
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?}
    volumes:
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The official image ships without curl/wget/nc (a deliberate
      # security choice by the Qdrant maintainers), so this uses
      # bash's built-in /dev/tcp to check the port is accepting
      # connections instead of an HTTP readiness check.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────────────────────────────────────────────
  # MCP QDRANT — memory <-> agent bridge (Claude Code / Antigravity / Cursor)
  # Embeddings via FastEmbed (local ONNX, CPU-only, ~130MB) —
  # does NOT use Ollama or any paid API. Downloads the model once
  # from HuggingFace on first use; runs fully offline afterward.
  # Reached through mcp-gateway at http://localhost:3002/mcp/
  # ──────────────────────────────────────────────────────
  mcp-qdrant:
    build:
      context: ./qdrant
      dockerfile: Dockerfile
    container_name: aidd-mcp-qdrant
    restart: unless-stopped
    <<: *hardened
    volumes:
      - ./qdrant/run-mcp.py:/app/run-mcp.py:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5

  # ──────────────────────────────────────────────────────
  # MCP OBSIDIAN — vault <-> agent bridge
  # Local vault: specs, ADRs, and per-project conventions.
  # Reached through mcp-gateway at http://localhost:3001/mcp
  # ──────────────────────────────────────────────────────
  mcp-obsidian:
    build:
      context: ./obsidian
      dockerfile: Dockerfile
    container_name: aidd-mcp-obsidian
    restart: unless-stopped
    user: "${AIDD_UID:-1000}:${AIDD_GID:-1000}"
    <<: *hardened
    environment:
      - HOME=/tmp
    volumes:
      - ${OBSIDIAN_VAULT_PATH:?}:/vault

  # ──────────────────────────────────────────────────────
  # MCP GIT — local git operations on the workspace (status, diff, log,
  # branch, commit). It holds NO credentials: no ssh keys, no ssh-agent —
  # push/pull/fetch to remotes happen in your own terminal. Commit identity
  # comes from your ~/.gitconfig (read-only, as the system config).
  # Reached through mcp-gateway at http://localhost:3003/mcp
  # ──────────────────────────────────────────────────────
  mcp-git:
    build:
      context: ./git
      dockerfile: Dockerfile
    container_name: aidd-mcp-git
    restart: unless-stopped
    user: "${AIDD_UID:-1000}:${AIDD_GID:-1000}"
    <<: *hardened
    environment:
      - HOME=/tmp
      - LOGS_DIR=/tmp/logs
      - GIT_TERMINAL_PROMPT=0
      - GIT_SSH_COMMAND=ssh -o BatchMode=yes
    volumes:
      - ${WORKSPACE_PATH:?}:/workspace
      - type: bind
        source: ${GIT_CONFIG_PATH:-${HOME}/.gitconfig}
        target: /etc/gitconfig
        read_only: true

  # ──────────────────────────────────────────────────────
  # MCP GATEWAY — the only published entry to the MCP servers. Same ports as
  # before, so .mcp.json does not change; requests whose Host is not
  # localhost / 127.0.0.1 / [::1], or that carry a browser Origin from
  # another site, get 403 (gateway/nginx.conf).
  # ──────────────────────────────────────────────────────
  mcp-gateway:
    image: nginx:1.28.0-alpine
    container_name: aidd-mcp-gateway
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - mcp-obsidian
      - mcp-qdrant
      - mcp-git
      - mcp-atlas
    ports:
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:3001:3001"
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:3002:3002"
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:3003:3003"
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:3005:3005"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────
  # NEO4J — code graph (micro: symbols/calls; macro: contracts
  # between repos). Schema: neo4j/SCHEMA.md · ADR: docs/adr/ADR-001.
  # Browser: http://localhost:7474 · Bolt: bolt://localhost:7687
  #
  # Credentials must be supplied by the environment (see contract above).
  # NOTE: the official image only accepts `neo4j` as the initial user
  # (NEO4J_AUTH); the password is written to the volume on first start,
  # so changing it later requires `docker compose down -v` (dev only)
  # or ALTER USER via cypher-shell.
  # ──────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26.30-community
    restart: unless-stopped
    container_name: aidd-core-neo4j
    ports:
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:7474:7474"
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:?}/${NEO4J_PASSWORD:?}
      # Community Edition has a single user database; its name is fixed at
      # first start (initial.*) — like the password, it lives in the volume.
      - NEO4J_initial_dbms_default__database=${NEO4J_DATABASE:?}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP:?}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP:?}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:?}
      # Only these APOC procedures/functions are loaded: apoc.version (install-check), apoc.meta.*
      # (the debug MCP's schema tool) and the pure data helpers apoc.coll/text/map.* for
      # cypher_readonly queries. No apoc.load/export/cypher.* → no file or URL access and no
      # dynamic Cypher from a query that reaches the database.
      - NEO4J_dbms_security_procedures_allowlist=apoc.version,apoc.meta.*,apoc.coll.*,apoc.text.*,apoc.map.*
      - NEO4J_dbms_usage__report_enabled=false
    volumes:
      - neo4j_data:/data
    healthcheck:
      # cypher-shell can read NEO4J_USERNAME/NEO4J_PASSWORD from env, but
      # the server entrypoint would treat those as config settings, so
      # the check passes them explicitly instead.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:?} -p ${NEO4J_PASSWORD:?} -d ${NEO4J_DATABASE:?} 'RETURN 1' || exit 1"]
      # First start on a fresh volume downloads APOC and creates the database;
      # on slow networks that alone can take minutes. ~6 min budget total.
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ──────────────────────────────────────────────────────
  # NEO4J INIT — one-shot: applies code graph constraints and
  # indexes from neo4j/init/schema.cypher (idempotent).
  # ──────────────────────────────────────────────────────
  neo4j-init:
    image: neo4j:5.26.30-community
    container_name: aidd-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # cypher-shell reads these three directly.
      - NEO4J_ADDRESS=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USER:?}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?}
    volumes:
      - ./neo4j/init:/init:ro
    entrypoint: ["cypher-shell", "-d", "${NEO4J_DATABASE:?}", "-f", "/init/schema.cypher"]
    restart: "no"

  # ──────────────────────────────────────────────────────
  # MCP ATLAS — the code graph as the skills see it: read-only
  # intent tools (atlas_status, repo_map, find_symbol, who_calls,
  # symbol_context, ...), tenant-scoped, streamable HTTP through
  # mcp-gateway at http://localhost:3005/mcp  ·  health: /healthz
  # Same image as the indexer (`aidd serve`).
  # ──────────────────────────────────────────────────────
  mcp-atlas:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    image: aidd-indexer:local
    container_name: aidd-mcp-atlas
    restart: unless-stopped
    user: "${AIDD_UID:-1000}:${AIDD_GID:-1000}"
    <<: *hardened
    depends_on:
      neo4j:
        condition: service_healthy
    command: ["serve", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USER:?}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?}
      - NEO4J_DATABASE=${NEO4J_DATABASE:?}
      - AIDD_TENANT=${AIDD_TENANT:?}
      # multi-tenant mode: raw Cypher can read every tenant. `off` withdraws cypher_readonly when
      # the tenants must not see each other (several client organizations on one machine)
      - ATLAS_RAW_CYPHER=${ATLAS_RAW_CYPHER:-on}
      - HOME=/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────────────
  # MCP NEO4J — raw Cypher access to the graph (Neo4j Labs), for
  # debugging the graph itself. Not needed by the skills (they use
  # mcp-atlas), so it is in the "debug" profile:
  #   docker compose --profile debug up -d mcp-neo4j   → http://localhost:3004/mcp/
  # ──────────────────────────────────────────────────────
  mcp-neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    container_name: aidd-mcp-neo4j
    profiles: ["debug"]
    restart: unless-stopped
    <<: *hardened
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USER:?}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?}
      - NEO4J_DATABASE=${NEO4J_DATABASE:?}
    ports:
      - "${AIDD_BIND_ADDRESS:-127.0.0.1}:3004:3000"

  # ──────────────────────────────────────────────────────
  # REFRESHER — keeps atlas current (D15): `aidd daemon` runs `refresh` for
  # every tenant of atlas.yaml every AIDD_REFRESH_INTERVAL_MINUTES (± 10 %).
  # Replaces the host schedulers (systemd timer / Task Scheduler / cron):
  # Docker restarts it on every OS. The workspace is mounted READ-ONLY;
  # each repo is synced into ./mirrors (local refs, then a remote fetch with
  # the read-only PAT in ./secrets/git-token when present). Last run:
  # ./state/status.json · `aidd schedule status` · `docker logs aidd-refresher`.
  # ──────────────────────────────────────────────────────
  refresher:
    <<: *indexer
    container_name: aidd-refresher
    restart: unless-stopped
    command: ["daemon"]
    environment:
      <<: *indexer-env
      AIDD_TRIGGER: scheduled
    stop_grace_period: 2m            # SIGTERM → finish the snapshot being written, then exit
    cpus: ${AIDD_REFRESH_CPUS:-2}
    mem_limit: ${AIDD_REFRESH_MEMORY:-4g}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "aidd", "daemon-health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ──────────────────────────────────────────────────────
  # INDEXER — the same image on demand (profile "tools"; `docker compose up`
  # skips it). The host wrapper ~/.aidd/aidd prefers `docker compose exec
  # refresher ...` when the refresher runs (shared lock), and falls back to:
  #   docker compose run --rm indexer plan        # what atlas.yaml would index
  #   docker compose run --rm indexer bootstrap   # index it all (asks first)
  #   docker compose run --rm indexer index <repo> [--ref develop]
  # ──────────────────────────────────────────────────────
  indexer:
    <<: *indexer
    container_name: aidd-indexer
    profiles: ["tools"]

secrets:
  git-token:
    # read-only PAT (one line). An EMPTY file is valid: the mirrors then follow your own fetches.
    file: ${AIDD_GIT_TOKEN_FILE:-./secrets/git-token}

volumes:
  qdrant_data:
  neo4j_data:
