name: indexer shape

on:
  push:
    branches: [main]
    paths: ["indexer/**"]
  pull_request:
    paths: ["indexer/**"]

jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.1
      - name: Functions above complexity 9 and modules above 300 lines (a report; it does not fail)
        run: python indexer/scripts/shape.py | tee -a "$GITHUB_STEP_SUMMARY"
