[project]
name = "aidd-indexer"
version = "0.2.13"
description = "aidd-stack code graph indexer: parses repositories with tree-sitter and loads the micro graph (files, symbols, calls, imports) into Neo4j (atlas)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-language-pack==1.17.0",
  "neo4j>=5.20,<7",
  "pyyaml>=6",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
# the `knowledge` service (mcp-knowledge): same FastEmbed and Qdrant client as mcp-server-qdrant 0.8.1,
# so the insights it embeds are found by `qdrant-find` and vice versa
knowledge = [
  "fastembed==0.9.0",
  "qdrant-client==1.19.1",
]

[project.scripts]
aidd = "aidd_indexer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aidd_indexer*"]

[tool.setuptools.package-data]
aidd_indexer = ["languages/*/*.scm"]
