[project]
name = "aidd-conventions-dotnet-praticis"
version = "0.1.0"
description = "aidd convention: the Praticis .NET pattern (Contracts + Api, CQRS over an in-house service bus)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aidd-indexer>=0.2.10"]

[project.entry-points."aidd.conventions"]
dotnet-praticis = "aidd_conventions_dotnet_praticis:DotnetPraticis"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aidd_conventions_dotnet_praticis*"]

[tool.setuptools.package-data]
aidd_conventions_dotnet_praticis = ["convention.yaml"]
